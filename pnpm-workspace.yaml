# pnpm 11 起移除了 onlyBuiltDependencies / onlyBuiltDependenciesFile /
# neverBuiltDependencies / ignoredBuiltDependencies，改用 allowBuilds（pnpm.io/settings/build）。
# CI 上无论 corepack 拉到的 pnpm 12.9.1 还是 action-setup 固定的 11 都属于"已移除旧键"的版本，
# 所以旧键放哪里都不生效（表现为 ERR_PNPM_IGNORED_BUILDS: esbuild）。
# build:client 依赖 esbuild 的 postinstall 落盘原生二进制，故显式允许。
allowBuilds:
  esbuild: true
