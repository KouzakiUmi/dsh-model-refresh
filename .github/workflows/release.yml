# 版本化发布：只有推 v* tag 才会出 Release。
# 安装方式（无需 npm registry）：
#   dsh plugin --profile desktop add https://github.com/KouzakiUmi/dsh-model-refresh/releases/download/v<version>/dsh-model-refresh.tgz
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Tag must match package.json version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version, name } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`tag ${process.env.RELEASE_TAG} does not match ${name}@${version}`);
          }
          console.log(`verified ${name}@${version}`);
          NODE

      # pnpm 12 起不再读取 pnpm-workspace.yaml 的 onlyBuiltDependencies，
      # 会让 esbuild 的构建脚本被拦截（ERR_PNPM_IGNORED_BUILDS）。固定 major 11。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install dependencies
        # 依赖构建白名单见 pnpm-workspace.yaml 的 allowBuilds
        # （pnpm 11 起 onlyBuiltDependencies 等旧键已被移除，放哪里都不生效）。
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          npm run build:client

      - name: Tests
        run: npm run test

      - name: Manifest and syntax checks
        run: node scripts/check-manifest.mjs

      - name: Pack and validate release asset
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/prepare-release.mjs

      - name: Upload verified asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist/dsh-model-refresh.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/dsh-model-refresh.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
