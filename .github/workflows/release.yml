# 版本化发布：只有推 v* tag 才会出 Release。
# 安装方式（无需 npm registry）：
#   dsh plugin --profile desktop add https://github.com/KouzakiUmi/dsh-model-refresh/releases/download/v<version>/dsh-model-refresh.tgz
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag must match package.json version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version, name } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`tag ${process.env.RELEASE_TAG} does not match ${name}@${version}`);
          }
          console.log(`verified ${name}@${version}`);
          NODE

      # pnpm 12 起不再读取 pnpm-workspace.yaml 的 onlyBuiltDependencies，
      # 会让 esbuild 的构建脚本被拦截（ERR_PNPM_IGNORED_BUILDS）。固定 major 11。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        # pnpm 10/11 默认拦截依赖构建脚本，CI 上多轮尝试 onlyBuiltDependencies
        # （package.json 字段 / pnpm-workspace.yaml / --config 传参）均无效；
        # 本包依赖很薄，直接用 npm 安装，esbuild 的 postinstall 可正常执行。
        run: npm install --no-audit --no-fund

      - name: Build
        run: |
          npm run build:client

      - name: Tests
        run: npm run test

      - name: Manifest and syntax checks
        run: node scripts/check-manifest.mjs

      - name: Pack and validate release asset
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/prepare-release.mjs

      - name: Upload verified asset
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/dsh-model-refresh.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dsh-model-refresh.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
